<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>XVNN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0f0f0f;
    --bg-2: #181818;
    --bg-3: #212121;
    --bg-hover: #272727;
    --border: #272727;
    --red: #e50914;
    --text: #f1f1f1;
    --text-2: #aaaaaa;
    --text-3: #717171;
    --green: #2ecc71;
    --header-h: 56px;
  }

  html, body {
    min-height: 100%;
    font-family: 'Roboto', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body { padding-bottom: 40px; }

  /* ============ HEADER ============ */
  .top-header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--header-h);
    background: var(--bg);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    z-index: 100;
    border-bottom: 1px solid var(--border);
  }

  .back-btn {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    color: var(--text);
    cursor: pointer;
    border-radius: 50%;
  }

  .back-btn:hover { background: var(--bg-3); }

  .back-btn svg { width: 20px; height: 20px; }

  .header-title {
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -0.3px;
  }

  .header-title span { color: var(--red); }

  /* ============ PLAYER ============ */
  .player-wrapper {
    margin-top: var(--header-h);
    width: 100%;
    background: #000;
    position: relative;
    aspect-ratio: 16 / 9;
  }

  .player-wrapper video {
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
    object-fit: contain;
  }

  .player-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .player-placeholder img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .placeholder-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .big-play {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: rgba(229, 9, 20, 0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }

  .player-placeholder:hover .big-play {
    background: var(--red);
    transform: scale(1.05);
  }

  .big-play svg {
    width: 26px;
    height: 26px;
    color: #fff;
    margin-left: 3px;
  }

  .quality-indicator {
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 3px 8px;
    background: rgba(0,0,0,0.7);
    color: #fff;
    font-size: 11px;
    font-weight: 500;
    border-radius: 3px;
    display: none;
  }

  /* ============ INFO ============ */
  .container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 16px;
  }

  .video-title {
    font-size: 18px;
    font-weight: 500;
    line-height: 1.35;
    margin: 16px 0 8px;
  }

  .video-stats {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text-3);
    margin-bottom: 16px;
  }

  .video-stats .dot {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--text-3);
  }

  /* ============ CANAL + ACCIONES ============ */
  .channel-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }

  .channel-info {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .channel-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--red);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 500;
    color: #fff;
    flex-shrink: 0;
  }

  .channel-name {
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }

  .action-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    background: var(--bg-3);
    border: none;
    border-radius: 18px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .action-btn:hover { background: var(--bg-hover); }

  .action-btn svg { width: 18px; height: 18px; }

  .action-btn.like.active {
    background: rgba(46, 204, 113, 0.15);
    color: var(--green);
  }

  .action-btn.dislike.active {
    background: rgba(229, 9, 20, 0.15);
    color: var(--red);
  }

  .action-btn.download {
    background: var(--bg-3);
    color: var(--text);
  }

  /* Separador vertical entre like y dislike */
  .actions .divider {
    width: 1px;
    background: var(--border);
    margin: 6px 0;
  }

  /* ============ DESCRIPCIÓN ============ */
  .description {
    padding: 14px;
    background: var(--bg-2);
    border-radius: 8px;
    margin-top: 12px;
    font-size: 14px;
    line-height: 1.5;
    color: var(--text-2);
  }

  /* ============ RELACIONADOS ============ */
  .related {
    margin-top: 24px;
  }

  .related h3 {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-2);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .related-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .related-card {
    display: flex;
    gap: 10px;
    cursor: pointer;
  }

  .related-thumb {
    position: relative;
    width: 160px;
    aspect-ratio: 16 / 9;
    background: var(--bg-2);
    border-radius: 8px;
    overflow: hidden;
    flex-shrink: 0;
  }

  .related-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .related-duration {
    position: absolute;
    bottom: 4px;
    right: 4px;
    padding: 2px 4px;
    background: rgba(0,0,0,0.85);
    border-radius: 3px;
    font-size: 10px;
    font-weight: 500;
    color: #fff;
  }

  .related-info { flex: 1; min-width: 0; }

  .related-title {
    font-size: 13px;
    font-weight: 500;
    line-height: 1.35;
    margin-bottom: 4px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .related-meta {
    font-size: 11px;
    color: var(--text-3);
  }

  /* ============ TOAST ============ */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    padding: 10px 18px;
    background: var(--bg-3);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    opacity: 0;
    transition: all 0.3s ease;
    pointer-events: none;
    z-index: 200;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  /* ============ RESPONSIVE ============ */
  @media (min-width: 1000px) {
    .container {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .main-col { min-width: 0; }
    .side-col { padding-top: 16px; }

    .related { margin-top: 0; }
  }
</style>
</head>
<body>

<header class="top-header">
  <button class="back-btn" id="backBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
  </button>
  <div class="header-title">XV<span>NN</span></div>
</header>

<div class="player-wrapper">
  <video id="videoPlayer" controls playsinline preload="metadata" style="display:none;"></video>
  <div class="player-placeholder" id="playerPlaceholder">
    <img id="placeholderThumb" src="" alt="">
    <div class="placeholder-overlay">
      <div class="big-play">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
      </div>
    </div>
  </div>
  <div class="quality-indicator" id="qualityIndicator"></div>
</div>

<div class="container">
  <div class="main-col">
    <h1 class="video-title" id="videoTitle">Cargando...</h1>

    <div class="video-stats">
      <span id="videoViews">0 vistas</span>
      <span class="dot"></span>
      <span id="videoDate">Hoy</span>
    </div>

    <div class="channel-row">
      <div class="channel-info">
        <div class="channel-avatar" id="channelAvatar">?</div>
        <div class="channel-name" id="channelName">Autor</div>
      </div>

      <div class="actions">
        <button class="action-btn like" id="likeBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path>
          </svg>
          <span id="likeCount">0</span>
        </button>

        <button class="action-btn dislike" id="dislikeBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"></path>
          </svg>
          <span id="dislikeCount">0</span>
        </button>

        <button class="action-btn download" id="downloadBtn" title="Descargar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </button>
      </div>
    </div>

    <div class="description" id="videoDescription">Cargando...</div>
  </div>

  <aside class="side-col">
    <div class="related">
      <h3>Relacionados</h3>
      <div class="related-list" id="relatedList"></div>
    </div>
  </aside>
</div>

<div class="toast" id="toast">Mensaje</div>

<script>
  const API_URL = window.location.origin + '/api';
  const token = localStorage.getItem('xvnn_token');

  if (!token) window.location.href = 'auth.html';

  const params = new URLSearchParams(window.location.search);
  const videoId = params.get('id') || localStorage.getItem('xvnn_current_video');

  let currentVideo = null;
  let userReaction = null;
  let hlsInstance = null;

  const els = {
    backBtn: document.getElementById('backBtn'),
    player: document.getElementById('videoPlayer'),
    placeholder: document.getElementById('playerPlaceholder'),
    placeholderThumb: document.getElementById('placeholderThumb'),
    title: document.getElementById('videoTitle'),
    views: document.getElementById('videoViews'),
    date: document.getElementById('videoDate'),
    channelAvatar: document.getElementById('channelAvatar'),
    channelName: document.getElementById('channelName'),
    description: document.getElementById('videoDescription'),
    likeBtn: document.getElementById('likeBtn'),
    dislikeBtn: document.getElementById('dislikeBtn'),
    downloadBtn: document.getElementById('downloadBtn'),
    likeCount: document.getElementById('likeCount'),
    dislikeCount: document.getElementById('dislikeCount'),
    relatedList: document.getElementById('relatedList'),
    qualityIndicator: document.getElementById('qualityIndicator'),
    toast: document.getElementById('toast')
  };

  async function loadVideo() {
    try {
      const res = await fetch(`${API_URL}/videos/${videoId}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();

      if (!res.ok) {
        showToast(data.message || 'Video no encontrado');
        setTimeout(() => window.location.href = 'web.html', 1500);
        return;
      }

      currentVideo = data;
      userReaction = data.userReaction;

      els.title.textContent = data.title;
      els.views.textContent = `${data.views} vistas`;
      els.date.textContent = formatDate(data.createdAt);
      els.description.textContent = data.description || 'Sin descripción';
      els.placeholderThumb.src = data.thumb;
      els.player.poster = data.thumb;
      els.likeCount.textContent = formatNumber(data.likes);
      els.dislikeCount.textContent = formatNumber(data.dislikes);

      const authorName = data.author?.name || 'Anónimo';
      els.channelName.textContent = authorName;
      els.channelAvatar.textContent = authorName.charAt(0).toUpperCase();

      if (userReaction === 'like') els.likeBtn.classList.add('active');
      else if (userReaction === 'dislike') els.dislikeBtn.classList.add('active');

      document.title = `${data.title} · XVNN`;

      loadRelated();
    } catch (err) {
      showToast('Error cargando video');
    }
  }

  async function loadRelated() {
    try {
      const res = await fetch(`${API_URL}/videos?category=${currentVideo.category}&limit=8`);
      const data = await res.json();
      const related = (data.videos || []).filter(v => v.id !== videoId).slice(0, 6);

      if (!related.length) {
        els.relatedList.innerHTML = '<p style="color:var(--text-3);font-size:13px;">Sin videos relacionados</p>';
        return;
      }

      els.relatedList.innerHTML = related.map(v => `
        <div class="related-card" data-id="${v.id}">
          <div class="related-thumb">
            <img src="${v.thumb}" alt="">
            <span class="related-duration">${v.duration}</span>
          </div>
          <div class="related-info">
            <div class="related-title">${escapeHtml(v.title)}</div>
            <div class="related-meta">${v.views} vistas</div>
          </div>
        </div>
      `).join('');

      document.querySelectorAll('.related-card').forEach(card => {
        card.addEventListener('click', () => {
          localStorage.setItem('xvnn_current_video', card.dataset.id);
          window.location.href = `watch.html?id=${card.dataset.id}`;
        });
      });
    } catch (err) {
      console.error(err);
    }
  }

  // ============ PLAYER ============
  els.placeholder.addEventListener('click', () => {
    els.placeholder.style.display = 'none';
    els.player.style.display = 'block';

    const source = currentVideo.hlsUrl || currentVideo.videoUrl;

    if (currentVideo.hlsUrl && window.Hls && Hls.isSupported()) {
      hlsInstance = new Hls({
        maxBufferLength: 15,
        maxMaxBufferLength: 30,
        startLevel: -1,
        abrEwmaDefaultEstimate: 500000,
        enableWorker: true
      });

      hlsInstance.loadSource(source);
      hlsInstance.attachMedia(els.player);

      hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
        els.player.play().catch(() => {});
      });

      hlsInstance.on(Hls.Events.LEVEL_SWITCHED, (event, data) => {
        const level = hlsInstance.levels[data.level];
        if (level && level.height) {
          els.qualityIndicator.style.display = 'block';
          els.qualityIndicator.textContent = `${level.height}p`;
        }
      });

      hlsInstance.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hlsInstance.startLoad();
          else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hlsInstance.recoverMediaError();
          else {
            hlsInstance.destroy();
            els.player.src = currentVideo.videoUrl;
            els.player.play().catch(() => {});
          }
        }
      });
    } else if (els.player.canPlayType('application/vnd.apple.mpegurl') && currentVideo.hlsUrl) {
      els.player.src = currentVideo.hlsUrl;
      els.player.play().catch(() => {});
    } else {
      els.player.src = currentVideo.videoUrl;
      els.player.play().catch(() => {});
    }

    fetch(`${API_URL}/videos/${videoId}/view`, { method: 'POST' }).catch(() => {});
  });

  // ============ REACCIONES ============
  async function react(reaction) {
    try {
      const res = await fetch(`${API_URL}/videos/${videoId}/react`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ reaction })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message);

      els.likeCount.textContent = formatNumber(data.likes);
      els.dislikeCount.textContent = formatNumber(data.dislikes);
      userReaction = data.userReaction;

      els.likeBtn.classList.toggle('active', userReaction === 'like');
      els.dislikeBtn.classList.toggle('active', userReaction === 'dislike');
    } catch (err) {
      showToast('Error');
    }
  }

  els.likeBtn.addEventListener('click', () => react(userReaction === 'like' ? null : 'like'));
  els.dislikeBtn.addEventListener('click', () => react(userReaction === 'dislike' ? null : 'dislike'));

  // ============ DESCARGA ============
  els.downloadBtn.addEventListener('click', () => {
    const link = document.createElement('a');
    link.href = `${API_URL}/videos/${videoId}/download`;
    link.download = `XVNN_${currentVideo.title.replace(/[^a-z0-9]/gi, '_')}.mp4`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    showToast('Descarga iniciada');
  });

  // ============ NAVEGACIÓN ============
  els.backBtn.addEventListener('click', () => {
    if (hlsInstance) hlsInstance.destroy();
    if (document.referrer && document.referrer.includes('web.html')) {
      window.history.back();
    } else {
      window.location.href = 'web.html';
    }
  });

  window.addEventListener('beforeunload', () => {
    if (hlsInstance) hlsInstance.destroy();
  });

  // ============ UTILS ============
  function formatNumber(n) {
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace('.0', '') + 'M';
    if (n >= 1000) return (n / 1000).toFixed(1).replace('.0', '') + 'K';
    return n.toString();
  }

  function formatDate(iso) {
    if (!iso) return 'Hoy';
    const d = new Date(iso);
    const diff = Date.now() - d;
    const days = Math.floor(diff / 86400000);
    if (days === 0) return 'Hoy';
    if (days === 1) return 'Ayer';
    if (days < 7) return `Hace ${days} días`;
    if (days < 30) return `Hace ${Math.floor(days / 7)} semanas`;
    if (days < 365) return `Hace ${Math.floor(days / 30)} meses`;
    return `Hace ${Math.floor(days / 365)} años`;
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
  }

  let toastTimer;
  function showToast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => els.toast.classList.remove('show'), 2200);
  }

  loadVideo();
</script>

</body>
</html>
