<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>XVNN · Mis videos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0a0a0a; --bg-2: #141414; --bg-3: #1c1c1c;
    --border: #1f1f1f; --text: #f5f5f5; --text-2: #a0a0a0;
    --text-3: #666666; --primary: #e50914; --green: #2ecc71;
  }
  html, body { min-height: 100%; font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; -webkit-font-smoothing: antialiased; }

  .top-header {
    position: fixed; top: 0; left: 0; right: 0; height: 52px;
    background: rgba(10,10,10,0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; padding: 0 12px; z-index: 90;
  }
  .icon-btn { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; color: var(--text); cursor: pointer; border-radius: 50%; flex-shrink: 0; }
  .icon-btn:hover { background: var(--bg-3); }
  .icon-btn svg { width: 20px; height: 20px; }
  .header-title { flex: 1; font-size: 15px; font-weight: 600; letter-spacing: 1px; }

  .filters-bar {
    position: fixed; top: 52px; left: 0; right: 0;
    background: var(--bg); border-bottom: 1px solid var(--border);
    z-index: 85; padding: 10px 0;
  }
  .filters-scroll {
    display: flex; gap: 8px; overflow-x: auto; padding: 0 12px; scrollbar-width: none;
  }
  .filters-scroll::-webkit-scrollbar { display: none; }
  .filter-chip {
    padding: 7px 16px; background: transparent;
    border: 1px solid var(--border); border-radius: 18px;
    color: var(--text-3); font-family: inherit; font-size: 12px; font-weight: 500;
    cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: all 0.2s ease;
  }
  .filter-chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }

  .container { max-width: 900px; margin: 0 auto; padding: 116px 16px 60px; }

  .video-list { display: flex; flex-direction: column; gap: 10px; }

  .video-item {
    display: flex; gap: 12px; padding: 10px;
    background: var(--bg-2); border-radius: 10px;
    position: relative; transition: background 0.15s ease;
    cursor: pointer;
  }
  .video-item:hover { background: var(--bg-3); }

  .video-thumb {
    width: 120px; aspect-ratio: 16 / 9;
    background: var(--bg-3); border-radius: 8px;
    overflow: hidden; flex-shrink: 0;
  }
  .video-thumb img { width: 100%; height: 100%; object-fit: cover; }

  .video-info {
    flex: 1; min-width: 0; display: flex;
    flex-direction: column; justify-content: center;
    padding-right: 44px;
  }

  .video-item-title {
    font-size: 13px; font-weight: 500; line-height: 1.35;
    margin-bottom: 6px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .video-item-meta {
    font-size: 11px; color: var(--text-3);
    display: flex; gap: 10px; flex-wrap: wrap;
  }

  .delete-btn {
    position: absolute; top: 50%; right: 10px;
    transform: translateY(-50%);
    width: 36px; height: 36px; border-radius: 50%;
    background: transparent; border: none;
    color: var(--text-3); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s ease;
  }
  .delete-btn:hover {
    background: rgba(229,9,20,0.1);
    color: var(--primary);
  }
  .delete-btn svg { width: 16px; height: 16px; }

  .empty {
    text-align: center; padding: 60px 20px;
    color: var(--text-3); font-size: 13px; line-height: 1.5;
  }
  .empty svg { width: 48px; height: 48px; margin-bottom: 16px; opacity: 0.3; }
  .empty h3 { font-size: 15px; font-weight: 500; color: var(--text-2); margin-bottom: 6px; }

  .loading { text-align: center; padding: 60px; }
  .spinner {
    display: inline-block; width: 28px; height: 28px;
    border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--primary);
    border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
    padding: 12px 20px; background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); font-size: 13px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6); opacity: 0;
    transition: all 0.3s ease; pointer-events: none; z-index: 200;
    max-width: calc(100% - 32px);
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<header class="top-header">
  <button class="icon-btn" id="backBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
  </button>
  <div class="header-title">MIS VIDEOS</div>
  <div style="width: 38px;"></div>
</header>

<div class="filters-bar">
  <div class="filters-scroll" id="filtersScroll">
    <button class="filter-chip active" data-category="all">Todos</button>
    <button class="filter-chip" data-category="Hetero">Hetero</button>
    <button class="filter-chip" data-category="Gay">Gay</button>
    <button class="filter-chip" data-category="Bi">Bi</button>
    <button class="filter-chip" data-category="Trans">Trans</button>
  </div>
</div>

<div class="container">
  <div class="video-list" id="videoList">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API_URL = window.location.origin + '/api';
  const token = localStorage.getItem('xvnn_token');
  if (!token) window.location.href = 'auth.html';

  let allVideos = [];
  let currentFilter = 'all';

  const els = {
    backBtn: document.getElementById('backBtn'),
    filtersScroll: document.getElementById('filtersScroll'),
    videoList: document.getElementById('videoList'),
    toast: document.getElementById('toast')
  };

  function escapeHtml(t) {
    const d = document.createElement('div');
    d.textContent = t || '';
    return d.innerHTML;
  }

  function formatNumber(n) {
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace('.0', '') + 'M';
    if (n >= 1000) return (n / 1000).toFixed(1).replace('.0', '') + 'K';
    return n.toString();
  }

  let toastTimer;
  function showToast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => els.toast.classList.remove('show'), 2500);
  }

  async function loadVideos() {
    try {
      const res = await fetch(`${API_URL}/videos/mine`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message);

      allVideos = data.videos || [];
      renderFiltered();
    } catch (err) {
      els.videoList.innerHTML = `<div class="empty"><h3>Error</h3><p>${escapeHtml(err.message)}</p></div>`;
    }
  }

  function renderFiltered() {
    let videos = allVideos;
    if (currentFilter !== 'all') {
      videos = allVideos.filter(v => v.category === currentFilter);
    }

    if (allVideos.length === 0) {
      els.videoList.innerHTML = `
        <div class="empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
            <polygon points="10 8 16 12 10 16 10 8" fill="currentColor"></polygon>
          </svg>
          <h3>No has subido videos</h3>
          <p>Usa el bot de Telegram para publicar tu primer video</p>
        </div>
      `;
      return;
    }

    if (videos.length === 0) {
      els.videoList.innerHTML = `<div class="empty"><p>No hay videos en esta categoría</p></div>`;
      return;
    }

    els.videoList.innerHTML = videos.map(v => `
      <div class="video-item" data-id="${v.id}">
        <div class="video-thumb">
          <img src="${v.thumb}" alt="" loading="lazy">
        </div>
        <div class="video-info">
          <div class="video-item-title">${escapeHtml(v.title)}</div>
          <div class="video-item-meta">
            <span>${v.category}</span>
            <span>${v.views} vistas</span>
            <span>${v.likes} likes</span>
          </div>
        </div>
        <button class="delete-btn" data-id="${v.id}" title="Eliminar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
      </div>
    `).join('');

    // Click para abrir video
    document.querySelectorAll('.video-item').forEach(item => {
      item.addEventListener('click', (e) => {
        if (e.target.closest('.delete-btn')) return;
        localStorage.setItem('xvnn_current_video', item.dataset.id);
        window.location.href = `watch.html?id=${item.dataset.id}`;
      });
    });

    // Click para eliminar
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const id = btn.dataset.id;
        const item = btn.closest('.video-item');
        const title = item.querySelector('.video-item-title').textContent;

        if (!confirm(`¿Eliminar "${title}"?\n\nEsta acción no se puede deshacer.`)) return;

        btn.disabled = true;
        item.style.opacity = '0.5';

        try {
          const res = await fetch(`${API_URL}/videos/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (!res.ok) throw new Error('Error');

          item.style.transition = 'all 0.3s ease';
          item.style.transform = 'translateX(-20px)';
          item.style.opacity = '0';

          setTimeout(() => {
            item.remove();
            allVideos = allVideos.filter(v => v.id !== id);
            showToast('Video eliminado');
            if (document.querySelectorAll('.video-item').length === 0) renderFiltered();
          }, 300);
        } catch (err) {
          showToast('Error eliminando');
          btn.disabled = false;
          item.style.opacity = '1';
        }
      });
    });
  }

  els.filtersScroll.addEventListener('click', (e) => {
    const chip = e.target.closest('.filter-chip');
    if (!chip) return;
    const cat = chip.dataset.category;
    if (cat === currentFilter) return;

    currentFilter = cat;
    document.querySelectorAll('.filter-chip').forEach(c => {
      c.classList.toggle('active', c.dataset.category === cat);
    });
    renderFiltered();
  });

  els.backBtn.addEventListener('click', () => {
    if (window.history.length > 1) window.history.back();
    else window.location.href = 'profile.html';
  });

  loadVideos();
</script>

</body>
</html>
