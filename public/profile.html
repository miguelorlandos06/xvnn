<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>XVNN · Perfil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0f0f0f;
    --bg-2: #181818;
    --bg-3: #212121;
    --bg-hover: #272727;
    --border: #272727;
    --red: #e50914;
    --text: #f1f1f1;
    --text-2: #aaaaaa;
    --text-3: #717171;
    --green: #2ecc71;
    --header-h: 56px;
  }

  html, body {
    min-height: 100%;
    font-family: 'Roboto', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body { padding-bottom: 90px; }

  .top-header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--header-h);
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    z-index: 100;
  }

  .brand {
    font-size: 20px;
    font-weight: 500;
    letter-spacing: -0.5px;
  }

  .brand span { color: var(--red); }

  .logout-btn {
    padding: 8px 14px;
    background: transparent;
    border: none;
    color: var(--text-2);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }

  .logout-btn:hover { color: var(--text); }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: calc(var(--header-h) + 24px) 16px 20px;
  }

  .profile-header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 28px;
  }

  .avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: var(--red);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 500;
    color: #fff;
    flex-shrink: 0;
  }

  .profile-info h1 {
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 4px;
  }

  .profile-info p {
    font-size: 14px;
    color: var(--text-3);
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 32px;
  }

  .stat {
    padding: 16px;
    background: var(--bg-2);
    border-radius: 8px;
    text-align: center;
  }

  .stat-value {
    font-size: 22px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 4px;
  }

  .stat-label {
    font-size: 11px;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* ============ PREFERENCIA DE CATEGORÍA ============ */
  .preference-section {
    margin-bottom: 32px;
  }

  .preference-desc {
    font-size: 13px;
    color: var(--text-3);
    margin-bottom: 12px;
  }

  .category-chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .chip {
    padding: 8px 16px;
    background: var(--bg-3);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text-2);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .chip:hover {
    background: var(--bg-hover);
    color: var(--text);
  }

  .chip.active {
    background: var(--red);
    border-color: var(--red);
    color: #fff;
  }

  /* ============ SECCIÓN ============ */
  .section-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-2);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .video-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .video-item {
    display: flex;
    gap: 12px;
    cursor: pointer;
    padding: 8px;
    border-radius: 8px;
    transition: background 0.15s ease;
    position: relative;
  }

  .video-item:hover { background: var(--bg-2); }

  .video-thumb {
    width: 140px;
    aspect-ratio: 16 / 9;
    background: var(--bg-3);
    border-radius: 8px;
    overflow: hidden;
    flex-shrink: 0;
  }

  .video-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .video-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-right: 44px;
  }

  .video-item-title {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.35;
    margin-bottom: 6px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .video-item-meta {
    font-size: 12px;
    color: var(--text-3);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-pill {
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .status-pill.ready {
    background: rgba(46, 204, 113, 0.15);
    color: var(--green);
  }

  .status-pill.processing {
    background: rgba(229, 9, 20, 0.15);
    color: var(--red);
  }

  .status-pill.failed {
    background: rgba(138, 138, 138, 0.15);
    color: var(--text-3);
  }

  /* ============ BOTÓN ELIMINAR ============ */
  .delete-btn {
    position: absolute;
    top: 50%;
    right: 8px;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-3);
    border: none;
    color: var(--text-3);
    cursor: pointer;
    border-radius: 50%;
    opacity: 0;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }

  .video-item:hover .delete-btn {
    opacity: 1;
  }

  .delete-btn:hover {
    background: rgba(229, 9, 20, 0.15);
    color: var(--red);
  }

  .delete-btn:disabled {
    cursor: not-allowed;
    opacity: 0.5;
  }

  .delete-btn svg {
    width: 16px;
    height: 16px;
  }

  @media (hover: none) {
    .delete-btn {
      opacity: 1;
    }
  }

  /* ============ EMPTY ============ */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-3);
  }

  .empty svg {
    width: 48px;
    height: 48px;
    margin-bottom: 16px;
    opacity: 0.4;
  }

  .empty h3 {
    font-size: 15px;
    font-weight: 400;
    margin-bottom: 6px;
    color: var(--text-2);
  }

  .empty p {
    font-size: 13px;
    line-height: 1.5;
  }

  /* ============ BOTTOM NAV ============ */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 64px;
    background: var(--bg);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-around;
    z-index: 100;
  }

  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    color: var(--text-3);
    font-size: 10px;
    font-weight: 500;
    text-decoration: none;
    padding: 6px;
  }

  .nav-item svg { width: 22px; height: 22px; }

  .nav-item.active { color: var(--text); }
  .nav-item.active svg { color: var(--red); }

  /* ============ TOAST ============ */
  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    padding: 10px 18px;
    background: var(--bg-3);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    opacity: 0;
    transition: all 0.3s ease;
    pointer-events: none;
    z-index: 200;
    max-width: calc(100% - 32px);
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  .toast.success {
    border-left: 3px solid var(--green);
  }

  .toast.error {
    border-left: 3px solid var(--red);
  }
</style>
</head>
<body>

<header class="top-header">
  <div class="brand">XV<span>NN</span></div>
  <button class="logout-btn" id="logoutBtn">Salir</button>
</header>

<div class="container">
  <div class="profile-header">
    <div class="avatar" id="avatar">?</div>
    <div class="profile-info">
      <h1 id="profileName">Cargando...</h1>
      <p id="profileUsername">@usuario</p>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="statVideos">0</div>
      <div class="stat-label">Videos</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="statViews">0</div>
      <div class="stat-label">Vistas</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="statLikes">0</div>
      <div class="stat-label">Likes</div>
    </div>
  </div>

  <!-- Categoría predefinida -->
  <div class="preference-section">
    <h2 class="section-title">Categoría predefinida</h2>
    <p class="preference-desc">Es la categoría que verás al abrir XVNN</p>
    <div class="category-chips" id="categoryChips">
      <button class="chip" data-cat="Hetero">Hetero</button>
      <button class="chip" data-cat="Gay">Gay</button>
      <button class="chip" data-cat="Bi">Bi</button>
      <button class="chip" data-cat="Trans">Trans</button>
    </div>
  </div>

  <h2 class="section-title">Mis videos</h2>
  <div class="video-list" id="videoList"></div>
</div>

<nav class="bottom-nav">
  <a href="web.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      <polyline points="9 22 9 12 15 12 15 22"></polyline>
    </svg>
    <span>Inicio</span>
  </a>
  <a href="https://t.me/xvnn_bot" target="_blank" rel="noopener" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"></line>
      <line x1="5" y1="12" x2="19" y2="12"></line>
    </svg>
    <span>Publicar</span>
  </a>
  <a href="profile.html" class="nav-item active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
      <circle cx="12" cy="7" r="4"></circle>
    </svg>
    <span>Perfil</span>
  </a>
</nav>

<div class="toast" id="toast"></div>

<script>
  const API_URL = window.location.origin + '/api';
  const token = localStorage.getItem('xvnn_token');

  if (!token) window.location.href = 'auth.html';

  const els = {
    avatar: document.getElementById('avatar'),
    profileName: document.getElementById('profileName'),
    profileUsername: document.getElementById('profileUsername'),
    statVideos: document.getElementById('statVideos'),
    statViews: document.getElementById('statViews'),
    statLikes: document.getElementById('statLikes'),
    videoList: document.getElementById('videoList'),
    logoutBtn: document.getElementById('logoutBtn'),
    toast: document.getElementById('toast')
  };

  // ============ UTILIDADES ============
  function formatNumber(n) {
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace('.0', '') + 'M';
    if (n >= 1000) return (n / 1000).toFixed(1).replace('.0', '') + 'K';
    return n.toString();
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
  }

  let toastTimer;
  function showToast(msg, type = 'info') {
    els.toast.textContent = msg;
    els.toast.className = `toast show ${type}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => els.toast.classList.remove('show'), 2500);
  }

  // ============ CARGAR PERFIL ============
  async function loadProfile() {
    try {
      const headers = { 'Authorization': `Bearer ${token}` };

      const [meRes, videosRes] = await Promise.all([
        fetch(`${API_URL}/auth/me`, { headers }),
        fetch(`${API_URL}/videos?limit=100`, { headers })
      ]);

      const meData = await meRes.json();
      const videosData = await videosRes.json();

      if (!meRes.ok) throw new Error(meData.message || 'Error');

      const user = meData.user;
      const username = user.username || '';
      const initial = (user.name || username || '?').charAt(0).toUpperCase();

      els.avatar.textContent = initial;
      els.profileName.textContent = user.name || username;
      els.profileUsername.textContent = '@' + username;

      const myVideos = (videosData.videos || []).filter(v => v.author?.username === username);

      const totalViews = myVideos.reduce((sum, v) => sum + (v.viewsRaw || 0), 0);
      const totalLikes = myVideos.reduce((sum, v) => sum + (v.likes || 0), 0);

      els.statVideos.textContent = myVideos.length;
      els.statViews.textContent = formatNumber(totalViews);
      els.statLikes.textContent = formatNumber(totalLikes);

      renderVideos(myVideos);
    } catch (err) {
      console.error(err);
      els.profileName.textContent = 'Error';
      els.profileUsername.textContent = err.message;
    }
  }

  // ============ RENDERIZAR VIDEOS ============
  function renderVideos(videos) {
    if (!videos.length) {
      els.videoList.innerHTML = `
        <div class="empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
            <polygon points="10 8 16 12 10 16 10 8" fill="currentColor"></polygon>
          </svg>
          <h3>No has subido videos</h3>
          <p>Abre el bot de Telegram y envía un enlace<br>para publicar tu primer video</p>
        </div>
      `;
      return;
    }

    els.videoList.innerHTML = videos.map(v => {
      const status = v.status || 'ready';
      const statusText = status === 'ready' ? 'Listo' : status === 'processing' ? 'Procesando' : 'Error';
      return `
        <div class="video-item" data-id="${v.id}">
          <div class="video-thumb">
            <img src="${v.thumb}" alt="">
          </div>
          <div class="video-info">
            <div class="video-item-title">${escapeHtml(v.title)}</div>
            <div class="video-item-meta">
              <span class="status-pill ${status}">${statusText}</span>
              <span>${v.views} vistas · ${v.likes} likes</span>
            </div>
          </div>
          <button class="delete-btn" data-id="${v.id}" title="Eliminar video">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
        </div>
      `;
    }).join('');

    // Eventos de video (clic en el item)
    document.querySelectorAll('.video-item').forEach(item => {
      item.addEventListener('click', (e) => {
        if (e.target.closest('.delete-btn')) return;
        const id = item.dataset.id;
        localStorage.setItem('xvnn_current_video', id);
        window.location.href = `watch.html?id=${id}`;
      });
    });

    // Eventos de eliminar
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        e.preventDefault();

        const videoId = btn.dataset.id;
        const videoItem = btn.closest('.video-item');
        const videoTitle = videoItem.querySelector('.video-item-title')?.textContent || 'este video';

        if (!confirm(`¿Eliminar "${videoTitle}"?\n\nEsta acción no se puede deshacer.`)) {
          return;
        }

        btn.disabled = true;
        btn.style.opacity = '0.5';
        videoItem.style.opacity = '0.5';
        videoItem.style.pointerEvents = 'none';

        try {
          const res = await fetch(`${API_URL}/videos/${videoId}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
          });

          const data = await res.json();
          if (!res.ok) throw new Error(data.message || 'Error al eliminar');

          // Animación de salida
          videoItem.style.transition = 'all 0.3s ease';
          videoItem.style.transform = 'translateX(-20px)';
          videoItem.style.opacity = '0';

          setTimeout(() => {
            videoItem.remove();
            showToast('Video eliminado', 'success');

            // Actualizar contador de videos
            const current = parseInt(els.statVideos.textContent) || 0;
            els.statVideos.textContent = Math.max(0, current - 1);

            // Si no quedan videos, mostrar estado vacío
            if (document.querySelectorAll('.video-item').length === 0) {
              renderVideos([]);
            }
          }, 300);

        } catch (err) {
          showToast('Error: ' + err.message, 'error');
          btn.disabled = false;
          btn.style.opacity = '1';
          videoItem.style.opacity = '1';
          videoItem.style.pointerEvents = '';
        }
      });
    });
  }

  // ============ CATEGORÍA PREDEFINIDA ============
  async function loadPreference() {
    try {
      const res = await fetch(`${API_URL}/auth/preferences`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();
      if (res.ok && data.defaultCategory) {
        document.querySelectorAll('#categoryChips .chip').forEach(chip => {
          chip.classList.toggle('active', chip.dataset.cat === data.defaultCategory);
        });
      }
    } catch (err) {
      console.warn('Error cargando preferencia');
    }
  }

  document.getElementById('categoryChips')?.addEventListener('click', async (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;

    const cat = chip.dataset.cat;

    document.querySelectorAll('#categoryChips .chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');

    try {
      const res = await fetch(`${API_URL}/auth/preferences/category`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ category: cat })
      });
      if (res.ok) {
        localStorage.setItem('xvnn_category', cat);
        showToast('Categoría actualizada', 'success');
      }
    } catch (err) {
      console.error('Error guardando preferencia:', err);
      showToast('Error al guardar', 'error');
    }
  });

  // ============ LOGOUT ============
  els.logoutBtn.addEventListener('click', () => {
    localStorage.removeItem('xvnn_token');
    localStorage.removeItem('xvnn_user');
    localStorage.removeItem('xvnn_current_video');
    localStorage.removeItem('xvnn_current_category');
    window.location.href = 'auth.html';
  });

  // ============ INICIALIZACIÓN ============
  loadProfile();
  loadPreference();
</script>

</body>
</html>
