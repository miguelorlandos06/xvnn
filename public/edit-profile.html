<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>XVNN · Editar perfil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0a0a0a; --bg-2: #141414; --bg-3: #1c1c1c;
    --border: #1f1f1f; --text: #f5f5f5; --text-2: #a0a0a0;
    --text-3: #666666; --primary: #e50914; --green: #2ecc71;
  }
  html, body { min-height: 100%; font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; -webkit-font-smoothing: antialiased; }

  .top-header {
    position: fixed; top: 0; left: 0; right: 0; height: 52px;
    background: rgba(10,10,10,0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; padding: 0 12px; z-index: 90;
  }
  .icon-btn { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; color: var(--text); cursor: pointer; border-radius: 50%; flex-shrink: 0; }
  .icon-btn:hover { background: var(--bg-3); }
  .icon-btn svg { width: 20px; height: 20px; }
  .header-title { flex: 1; text-align: center; font-size: 15px; font-weight: 600; letter-spacing: 1px; }
  .save-btn {
    padding: 8px 16px; background: transparent; border: none;
    color: var(--primary); font-family: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer; border-radius: 16px; transition: all 0.2s ease;
    opacity: 0.4; pointer-events: none;
  }
  .save-btn.enabled { opacity: 1; pointer-events: auto; }
  .save-btn.enabled:hover { background: rgba(229,9,20,0.1); }

  .container { max-width: 500px; margin: 0 auto; padding: 76px 16px 60px; }

  /* Avatar */
  .avatar-section { text-align: center; margin-bottom: 36px; }
  .avatar-wrapper { position: relative; display: inline-block; margin-bottom: 14px; }
  .avatar {
    width: 120px; height: 120px; border-radius: 50%; background: var(--primary);
    display: flex; align-items: center; justify-content: center;
    font-size: 44px; font-weight: 600; color: #fff;
    overflow: hidden; text-transform: uppercase;
    border: 3px solid var(--bg-2); cursor: pointer;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .camera-btn {
    position: absolute; bottom: 0; right: 0;
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--primary); border: 3px solid var(--bg);
    display: flex; align-items: center; justify-content: center;
    color: #fff; cursor: pointer;
  }
  .camera-btn svg { width: 16px; height: 16px; }
  .avatar-hint { font-size: 11px; color: var(--text-3); line-height: 1.5; font-weight: 300; }
  input[type="file"] { display: none; }

  /* Form */
  .form-group { margin-bottom: 28px; }
  .form-label {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;
  }
  .form-label .char-count { font-size: 11px; color: var(--text-3); font-weight: 400; text-transform: none; letter-spacing: 0; }
  .form-label .char-count.warning { color: var(--primary); }

  .form-input, .form-textarea {
    width: 100%; padding: 12px 0; background: transparent;
    border: none; border-bottom: 1px solid var(--border);
    color: var(--text); font-family: inherit; font-size: 15px;
    outline: none; transition: border-color 0.2s ease; resize: none;
  }
  .form-input:focus, .form-textarea:focus { border-color: var(--primary); }
  .form-input::placeholder, .form-textarea::placeholder { color: var(--text-3); font-weight: 300; }
  .form-textarea { min-height: 60px; line-height: 1.5; }

  .input-prefix-wrapper { position: relative; }
  .input-prefix {
    position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    color: var(--text-3); font-size: 15px; pointer-events: none;
  }
  .input-prefix-wrapper .form-input { padding-left: 22px; }

  .input-hint { font-size: 11px; color: var(--text-3); margin-top: 6px; line-height: 1.4; font-weight: 300; }
  .input-hint.error { color: var(--primary); }

  /* Danger */
  .danger-section { margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--border); }
  .danger-title { font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .danger-btn {
    width: 100%; padding: 14px; background: transparent;
    border: 1px solid rgba(229,9,20,0.3); border-radius: 10px;
    color: var(--primary); font-family: inherit; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.2s ease;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .danger-btn:hover { background: rgba(229,9,20,0.08); }
  .danger-btn svg { width: 16px; height: 16px; }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
    padding: 12px 20px; background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); font-size: 13px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6); opacity: 0;
    transition: all 0.3s ease; pointer-events: none; z-index: 200;
    max-width: calc(100% - 32px);
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* Loading */
  .loading-overlay {
    position: fixed; inset: 0; background: rgba(10,10,10,0.85);
    display: flex; align-items: center; justify-content: center;
    z-index: 300; opacity: 0; visibility: hidden; transition: all 0.2s ease;
  }
  .loading-overlay.visible { opacity: 1; visibility: visible; }
  .loading-box { text-align: center; }
  .spinner {
    width: 28px; height: 28px; border: 3px solid rgba(255,255,255,0.1);
    border-top-color: var(--primary); border-radius: 50%;
    animation: spin 0.7s linear infinite; margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-box p { font-size: 12px; color: var(--text-2); }
</style>
</head>
<body>

<header class="top-header">
  <button class="icon-btn" id="backBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
  </button>
  <div class="header-title">EDITAR PERFIL</div>
  <button class="save-btn" id="saveBtn" disabled>Guardar</button>
</header>

<div class="container">
  <!-- Avatar -->
  <div class="avatar-section">
    <div class="avatar-wrapper">
      <div class="avatar" id="avatarPreview">?</div>
      <div class="camera-btn" id="cameraBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
      </div>
    </div>
    <p class="avatar-hint">Toca para cambiar · JPG, PNG o WebP · Máx 5 MB</p>
    <input type="file" id="avatarInput" accept="image/jpeg,image/png,image/webp">
  </div>

  <!-- Nombre -->
  <div class="form-group">
    <label class="form-label">
      <span>Nombre</span>
      <span class="char-count" id="nameCount">0/100</span>
    </label>
    <input type="text" class="form-input" id="nameInput" placeholder="Tu nombre" maxlength="100">
    <div class="input-hint" id="nameHint">Aparecerá en tu perfil</div>
  </div>

  <!-- Usuario -->
  <div class="form-group">
    <label class="form-label">
      <span>Usuario</span>
      <span class="char-count" id="usernameCount">0/50</span>
    </label>
    <div class="input-prefix-wrapper">
      <span class="input-prefix">@</span>
      <input type="text" class="form-input" id="usernameInput" placeholder="usuario" maxlength="50">
    </div>
    <div class="input-hint" id="usernameHint">Solo letras, números y _</div>
  </div>

  <!-- Bio -->
  <div class="form-group">
    <label class="form-label">
      <span>Bio</span>
      <span class="char-count" id="bioCount">0/200</span>
    </label>
    <textarea class="form-textarea" id="bioInput" placeholder="Cuéntanos algo sobre ti (opcional)" maxlength="200"></textarea>
  </div>

  <!-- Logout -->
  <div class="danger-section">
    <div class="danger-title">Cuenta</div>
    <button class="danger-btn" id="logoutBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      Cerrar sesión
    </button>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-box">
    <div class="spinner"></div>
    <p id="loadingText">Guardando...</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API_URL = window.location.origin + '/api';
  const token = localStorage.getItem('xvnn_token');
  if (!token) window.location.href = 'auth.html';

  let originalData = { name: '', username: '', bio: '', avatarUrl: null };
  let currentAvatarFile = null;

  const els = {
    backBtn: document.getElementById('backBtn'),
    saveBtn: document.getElementById('saveBtn'),
    avatarPreview: document.getElementById('avatarPreview'),
    cameraBtn: document.getElementById('cameraBtn'),
    avatarInput: document.getElementById('avatarInput'),
    nameInput: document.getElementById('nameInput'),
    usernameInput: document.getElementById('usernameInput'),
    bioInput: document.getElementById('bioInput'),
    nameCount: document.getElementById('nameCount'),
    usernameCount: document.getElementById('usernameCount'),
    bioCount: document.getElementById('bioCount'),
    nameHint: document.getElementById('nameHint'),
    usernameHint: document.getElementById('usernameHint'),
    logoutBtn: document.getElementById('logoutBtn'),
    loadingOverlay: document.getElementById('loadingOverlay'),
    loadingText: document.getElementById('loadingText'),
    toast: document.getElementById('toast')
  };

  let toastTimer;
  function showToast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => els.toast.classList.remove('show'), 2500);
  }

  function showLoading(text) {
    els.loadingText.textContent = text;
    els.loadingOverlay.classList.add('visible');
  }
  function hideLoading() { els.loadingOverlay.classList.remove('visible'); }

  function setSaveEnabled(enabled) {
    els.saveBtn.classList.toggle('enabled', enabled);
    els.saveBtn.disabled = !enabled;
  }

  async function loadProfile() {
    try {
      const res = await fetch(`${API_URL}/auth/me`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message);

      const user = data.user;
      originalData.name = user.name || '';
      originalData.username = user.username || '';
      originalData.bio = user.bio || '';
      originalData.avatarUrl = user.avatarUrl || null;

      els.nameInput.value = originalData.name;
      els.usernameInput.value = originalData.username;
      els.bioInput.value = originalData.bio;

      if (originalData.avatarUrl) {
        els.avatarPreview.innerHTML = `<img src="${originalData.avatarUrl}" alt="">`;
      } else {
        const initial = (originalData.name || originalData.username || '?').charAt(0).toUpperCase();
        els.avatarPreview.textContent = initial;
      }

      updateCounts();
      checkChanges();
    } catch (err) {
      showToast('Error cargando perfil');
    }
  }

  function checkChanges() {
    const nameChanged = els.nameInput.value.trim() !== originalData.name;
    const usernameChanged = els.usernameInput.value.trim() !== originalData.username;
    const bioChanged = els.bioInput.value.trim() !== originalData.bio;
    const avatarChanged = currentAvatarFile !== null;
    const hasChanges = nameChanged || usernameChanged || bioChanged || avatarChanged;
    const isValid = validateForm();
    setSaveEnabled(hasChanges && isValid);
  }

  function validateForm() {
    const name = els.nameInput.value.trim();
    const username = els.usernameInput.value.trim();

    if (name.length < 2 || name.length > 100) {
      els.nameHint.classList.add('error');
      els.nameHint.textContent = 'Entre 2 y 100 caracteres';
      return false;
    }
    els.nameHint.classList.remove('error');
    els.nameHint.textContent = 'Aparecerá en tu perfil';

    if (username.length < 3) {
      els.usernameHint.classList.add('error');
      els.usernameHint.textContent = 'Mínimo 3 caracteres';
      return false;
    }
    if (!/^[a-zA-Z0-9_]+$/.test(username)) {
      els.usernameHint.classList.add('error');
      els.usernameHint.textContent = 'Solo letras, números y _';
      return false;
    }
    els.usernameHint.classList.remove('error');
    els.usernameHint.textContent = 'Solo letras, números y _';

    return true;
  }

  function updateCounts() {
    els.nameCount.textContent = `${els.nameInput.value.length}/100`;
    els.nameCount.classList.toggle('warning', els.nameInput.value.length > 90);

    els.usernameCount.textContent = `${els.usernameInput.value.length}/50`;
    els.usernameCount.classList.toggle('warning', els.usernameInput.value.length > 45);

    els.bioCount.textContent = `${els.bioInput.value.length}/200`;
    els.bioCount.classList.toggle('warning', els.bioInput.value.length > 180);
  }

  els.nameInput.addEventListener('input', () => { updateCounts(); checkChanges(); });
  els.usernameInput.addEventListener('input', () => {
    const clean = els.usernameInput.value.replace(/[^a-zA-Z0-9_]/g, '');
    if (clean !== els.usernameInput.value) els.usernameInput.value = clean;
    updateCounts();
    checkChanges();
  });
  els.bioInput.addEventListener('input', () => { updateCounts(); checkChanges(); });

  els.cameraBtn.addEventListener('click', () => els.avatarInput.click());
  els.avatarPreview.addEventListener('click', () => els.avatarInput.click());

  els.avatarInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
      showToast('Formato no válido');
      els.avatarInput.value = '';
      return;
    }
    if (file.size > 5 * 1024 * 1024) {
      showToast('Máximo 5 MB');
      els.avatarInput.value = '';
      return;
    }

    currentAvatarFile = file;
    const reader = new FileReader();
    reader.onload = (ev) => {
      els.avatarPreview.innerHTML = `<img src="${ev.target.result}" alt="">`;
    };
    reader.readAsDataURL(file);
    checkChanges();
  });

  els.saveBtn.addEventListener('click', async () => {
    if (!validateForm()) return;

    const name = els.nameInput.value.trim();
    const username = els.usernameInput.value.trim();
    const bio = els.bioInput.value.trim();

    showLoading('Guardando cambios...');

    try {
      // Actualizar datos básicos
      if (name !== originalData.name || username !== originalData.username || bio !== originalData.bio) {
        const body = {};
        if (name !== originalData.name) body.name = name;
        if (username !== originalData.username) body.username = username;
        if (bio !== originalData.bio) body.bio = bio;

        const res = await fetch(`${API_URL}/auth/profile`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);

        if (data.token) localStorage.setItem('xvnn_token', data.token);
        if (data.user) {
          localStorage.setItem('xvnn_user', JSON.stringify(data.user));
          originalData.name = data.user.name;
          originalData.username = data.user.username;
          originalData.bio = data.user.bio;
        }
      }

      // Subir avatar
      if (currentAvatarFile) {
        showLoading('Subiendo foto...');
        const formData = new FormData();
        formData.append('avatar', currentAvatarFile);

        const res = await fetch(`${API_URL}/auth/avatar`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
          body: formData
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);
        originalData.avatarUrl = data.user.avatarUrl;
        currentAvatarFile = null;
      }

      hideLoading();
      showToast('Perfil actualizado');
      checkChanges();

      setTimeout(() => { window.location.href = 'profile.html'; }, 1200);

    } catch (err) {
      hideLoading();
      showToast(err.message);
    }
  });

  els.logoutBtn.addEventListener('click', () => {
    if (!confirm('¿Cerrar sesión?')) return;
    localStorage.removeItem('xvnn_token');
    localStorage.removeItem('xvnn_user');
    localStorage.removeItem('xvnn_category');
    window.location.href = 'auth.html';
  });

  els.backBtn.addEventListener('click', () => {
    const nameChanged = els.nameInput.value.trim() !== originalData.name;
    const usernameChanged = els.usernameInput.value.trim() !== originalData.username;
    const bioChanged = els.bioInput.value.trim() !== originalData.bio;
    if ((nameChanged || usernameChanged || bioChanged || currentAvatarFile) && !confirm('¿Descartar cambios?')) return;

    if (window.history.length > 1) window.history.back();
    else window.location.href = 'profile.html';
  });

  loadProfile();
</script>

</body>
</html>
