<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XVNN · Iniciar sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0f0f0f;
    --bg-2: #181818;
    --bg-3: #212121;
    --border: #272727;
    --red: #e50914;
    --text: #f1f1f1;
    --text-2: #aaaaaa;
    --text-3: #717171;
  }

  html, body {
    height: 100%;
    font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }

  .container {
    width: 100%;
    max-width: 400px;
  }

  /* ============ LOGO ============ */
  .logo {
    text-align: center;
    margin-bottom: 40px;
  }

  .logo h1 {
    font-size: 34px;
    font-weight: 500;
    letter-spacing: -1px;
    color: var(--text);
  }

  .logo h1 span {
    color: var(--red);
  }

  .logo p {
    font-size: 13px;
    color: var(--text-3);
    margin-top: 6px;
    font-weight: 400;
  }

  /* ============ TABS ============ */
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    margin-bottom: 28px;
  }

  .tab {
    flex: 1;
    padding: 12px;
    background: transparent;
    border: none;
    color: var(--text-3);
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    position: relative;
    transition: color 0.2s ease;
  }

  .tab.active {
    color: var(--text);
  }

  .tab.active::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--red);
  }

  /* ============ FORM ============ */
  .form-group {
    margin-bottom: 20px;
  }

  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-2);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .form-group input {
    width: 100%;
    padding: 12px 14px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s ease;
  }

  .form-group input::placeholder {
    color: var(--text-3);
  }

  .form-group input:focus {
    border-color: var(--red);
  }

  /* ============ BOTÓN ============ */
  .btn-primary {
    width: 100%;
    padding: 12px;
    background: var(--red);
    border: none;
    border-radius: 6px;
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.2s ease;
  }

  .btn-primary:hover:not(:disabled) {
    opacity: 0.9;
  }

  .btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* ============ MENSAJES ============ */
  .message {
    display: none;
    padding: 12px 14px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 20px;
  }

  .message.error {
    display: block;
    background: rgba(229, 9, 20, 0.08);
    border: 1px solid rgba(229, 9, 20, 0.3);
    color: #ff6b6b;
  }

  .message.success {
    display: block;
    background: rgba(46, 204, 113, 0.08);
    border: 1px solid rgba(46, 204, 113, 0.3);
    color: #2ecc71;
  }

  /* ============ SPINNER ============ */
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ============ FOOTER ============ */
  .footer {
    text-align: center;
    margin-top: 32px;
    font-size: 12px;
    color: var(--text-3);
    line-height: 1.6;
  }

  .footer a {
    color: var(--text-2);
    text-decoration: none;
  }

  .footer a:hover {
    color: var(--text);
  }
</style>
</head>
<body>

<div class="container">
  <div class="logo">
    <h1>XV<span>NN</span></h1>
    <p>Plataforma de videos</p>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="login">Iniciar sesión</button>
    <button class="tab" data-tab="register">Registrarse</button>
  </div>

  <div class="message" id="message"></div>

  <form id="authForm" autocomplete="off">
    <div class="form-group" id="nameGroup" style="display:none;">
      <label for="name">Nombre</label>
      <input type="text" id="name" placeholder="Tu nombre" autocomplete="name">
    </div>

    <div class="form-group">
      <label for="username">Usuario</label>
      <input type="text" id="username" placeholder="Tu usuario" autocomplete="username" required>
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="Tu contraseña" autocomplete="current-password" required>
    </div>

    <button type="submit" class="btn-primary" id="submitBtn">Iniciar sesión</button>
  </form>

  <p class="footer">Al continuar aceptas los <a href="#">términos y condiciones</a></p>
</div>

<script>
  const API_URL = window.location.origin + '/api';
  let currentTab = 'login';

  const tabs = document.querySelectorAll('.tab');
  const nameGroup = document.getElementById('nameGroup');
  const submitBtn = document.getElementById('submitBtn');
  const messageEl = document.getElementById('message');
  const form = document.getElementById('authForm');
  const nameInput = document.getElementById('name');
  const usernameInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const target = tab.dataset.tab;
      if (target === currentTab) return;
      currentTab = target;

      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');

      if (target === 'register') {
        nameGroup.style.display = 'block';
        submitBtn.textContent = 'Crear cuenta';
        passwordInput.setAttribute('autocomplete', 'new-password');
      } else {
        nameGroup.style.display = 'none';
        submitBtn.textContent = 'Iniciar sesión';
        passwordInput.setAttribute('autocomplete', 'current-password');
      }
      hideMessage();
    });
  });

  function showMessage(text, type = 'error') {
    messageEl.textContent = text;
    messageEl.className = `message ${type}`;
  }

  function hideMessage() {
    messageEl.className = 'message';
    messageEl.textContent = '';
  }

  function setLoading(loading) {
    if (loading) {
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span>Procesando...';
    } else {
      submitBtn.disabled = false;
      submitBtn.textContent = currentTab === 'login' ? 'Iniciar sesión' : 'Crear cuenta';
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideMessage();

    const name = nameInput.value.trim();
    const username = usernameInput.value.trim();
    const password = passwordInput.value;

    if (currentTab === 'register' && name.length < 2) {
      return showMessage('El nombre debe tener al menos 2 caracteres');
    }
    if (username.length < 3) {
      return showMessage('El usuario debe tener al menos 3 caracteres');
    }
    if (!/^[a-zA-Z0-9_]+$/.test(username)) {
      return showMessage('El usuario solo permite letras, números y _');
    }
    if (password.length < 6) {
      return showMessage('La contraseña debe tener al menos 6 caracteres');
    }

    setLoading(true);

    try {
      const endpoint = currentTab === 'register' ? '/auth/register' : '/auth/login';
      const body = currentTab === 'register' ? { name, username, password } : { username, password };

      const res = await fetch(API_URL + endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.message || 'Error del servidor');

      showMessage(currentTab === 'register' ? 'Cuenta creada' : 'Bienvenido', 'success');
      localStorage.setItem('xvnn_token', json.token);
      localStorage.setItem('xvnn_user', JSON.stringify(json.user));

      setTimeout(() => { window.location.href = 'web.html'; }, 600);
    } catch (err) {
      showMessage(err.message);
      setLoading(false);
    }
  });

  (function checkSession() {
    const token = localStorage.getItem('xvnn_token');
    if (token) window.location.href = 'web.html';
  })();
</script>

</body>
</html>
