<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>XVNN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0f0f0f;
    --bg-2: #181818;
    --bg-3: #212121;
    --bg-hover: #272727;
    --border: #272727;
    --red: #e50914;
    --text: #f1f1f1;
    --text-2: #aaaaaa;
    --text-3: #717171;
    --header-h: 56px;
  }

  html, body {
    height: 100%;
    font-family: 'Roboto', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body { padding-bottom: 70px; }

  .top-header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--header-h);
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    z-index: 100;
    border-bottom: 1px solid var(--border);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: -0.5px;
  }

  .brand span { color: var(--red); }

  .category-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 18px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }

  .category-btn:hover { background: var(--bg-hover); }

  .category-btn svg {
    width: 12px;
    height: 12px;
    transition: transform 0.2s ease;
  }

  .category-btn.open svg { transform: rotate(180deg); }

  .category-dropdown {
    position: absolute;
    top: calc(100% + 6px);
    right: 16px;
    min-width: 160px;
    background: var(--bg-3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-6px);
    transition: all 0.15s ease;
    z-index: 101;
  }

  .category-dropdown.open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .category-option {
    display: block;
    width: 100%;
    padding: 10px 12px;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    text-align: left;
    cursor: pointer;
    border-radius: 4px;
  }

  .category-option:hover { background: var(--bg-hover); }

  .category-option.active {
    background: var(--bg-hover);
    font-weight: 500;
  }

  .videos-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
    padding: calc(var(--header-h) + 16px) 16px 20px;
    max-width: 1600px;
    margin: 0 auto;
  }

  .video-card {
    cursor: pointer;
    transition: opacity 0.2s ease;
  }

  .video-card:active { opacity: 0.7; }

  .thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: var(--bg-2);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 10px;
  }

  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .duration {
    position: absolute;
    bottom: 6px;
    right: 6px;
    padding: 2px 5px;
    background: rgba(0,0,0,0.85);
    border-radius: 3px;
    font-size: 11px;
    font-weight: 500;
    color: #fff;
    letter-spacing: 0.2px;
  }

  .video-info {
    display: flex;
    gap: 10px;
  }

  .channel-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--red);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 500;
    color: #fff;
    flex-shrink: 0;
    text-transform: uppercase;
  }

  .video-details { flex: 1; min-width: 0; }

  .video-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.35;
    margin-bottom: 3px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .video-meta {
    font-size: 12px;
    color: var(--text-3);
    line-height: 1.4;
  }

  .video-meta .author {
    color: var(--text-3);
  }

  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 20px;
    color: var(--text-3);
  }

  .empty svg {
    width: 48px;
    height: 48px;
    margin-bottom: 16px;
    opacity: 0.4;
  }

  .empty h3 {
    font-size: 16px;
    font-weight: 400;
    margin-bottom: 6px;
    color: var(--text-2);
  }

  .empty p {
    font-size: 13px;
  }

  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 64px;
    background: var(--bg);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-around;
    z-index: 100;
  }

  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    color: var(--text-3);
    font-size: 10px;
    font-weight: 500;
    text-decoration: none;
    padding: 6px;
    transition: color 0.15s ease;
  }

  .nav-item svg {
    width: 22px;
    height: 22px;
  }

  .nav-item.active { color: var(--text); }
  .nav-item.active svg { color: var(--red); }

  @media (min-width: 640px) {
    .videos-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 20px 16px;
    }
  }

  @media (min-width: 900px) {
    .videos-grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  @media (min-width: 1200px) {
    .videos-grid {
      grid-template-columns: repeat(4, 1fr);
    }
  }

  @media (min-width: 1600px) {
    .videos-grid {
      grid-template-columns: repeat(5, 1fr);
    }
  }
</style>
</head>
<body>

<header class="top-header">
  <div class="brand">XV<span>NN</span></div>

  <div style="position: relative;">
    <button class="category-btn" id="categoryBtn">
      <span id="currentCategory">Hetero</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>

    <div class="category-dropdown" id="categoryDropdown">
      <button class="category-option" data-cat="Hetero">Hetero</button>
      <button class="category-option" data-cat="Gay">Gay</button>
      <button class="category-option" data-cat="Bi">Bi</button>
      <button class="category-option" data-cat="Trans">Trans</button>
    </div>
  </div>
</header>

<main class="videos-grid" id="videosGrid"></main>

<nav class="bottom-nav">
  <a href="web.html" class="nav-item active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      <polyline points="9 22 9 12 15 12 15 22"></polyline>
    </svg>
    <span>Inicio</span>
  </a>
  <a href="https://t.me/xvnn_bot" target="_blank" rel="noopener" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"></line>
      <line x1="5" y1="12" x2="19" y2="12"></line>
    </svg>
    <span>Publicar</span>
  </a>
  <a href="profile.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
      <circle cx="12" cy="7" r="4"></circle>
    </svg>
    <span>Perfil</span>
  </a>
</nav>

<script>
  const API_URL = window.location.origin + '/api';
  const CATEGORIES = ['Hetero', 'Gay', 'Bi', 'Trans'];

  let currentCategory = 'Hetero';

  const categoryBtn = document.getElementById('categoryBtn');
  const categoryDropdown = document.getElementById('categoryDropdown');
  const currentCategoryEl = document.getElementById('currentCategory');
  const categoryOptions = document.querySelectorAll('.category-option');
  const videosGrid = document.getElementById('videosGrid');

  (function checkAuth() {
    const token = localStorage.getItem('xvnn_token');
    if (!token) window.location.href = 'auth.html';
  })();

  // ============ CARGAR PREFERENCIA DEL USUARIO ============
  async function loadUserPreferences() {
    try {
      const token = localStorage.getItem('xvnn_token');
      const res = await fetch(`${API_URL}/auth/preferences`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();
      if (res.ok && data.defaultCategory) {
        currentCategory = data.defaultCategory;
        localStorage.setItem('xvnn_category', currentCategory);
      }
    } catch (err) {
      console.warn('No se pudo cargar la preferencia, usando Hetero');
      currentCategory = 'Hetero';
    }
  }

  function toggleDropdown(open) {
    const isOpen = open !== undefined ? open : !categoryDropdown.classList.contains('open');
    categoryDropdown.classList.toggle('open', isOpen);
    categoryBtn.classList.toggle('open', isOpen);
  }

  categoryBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleDropdown();
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.category-btn') && !e.target.closest('.category-dropdown')) {
      toggleDropdown(false);
    }
  });

  categoryOptions.forEach(opt => {
    opt.addEventListener('click', async () => {
      const cat = opt.dataset.cat;
      if (cat === currentCategory) return toggleDropdown(false);

      currentCategory = cat;
      localStorage.setItem('xvnn_category', cat);
      updateActiveOption();
      toggleDropdown(false);
      renderVideos();

      // Guardar en el backend (en background, sin bloquear)
      try {
        const token = localStorage.getItem('xvnn_token');
        await fetch(`${API_URL}/auth/preferences/category`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ category: cat })
        });
      } catch (err) {
        console.warn('No se pudo guardar la preferencia:', err.message);
      }
    });
  });

  function updateActiveOption() {
    currentCategoryEl.textContent = currentCategory;
    categoryOptions.forEach(opt => {
      opt.classList.toggle('active', opt.dataset.cat === currentCategory);
    });
  }

  async function fetchVideos(category) {
    const res = await fetch(`${API_URL}/videos?category=${category}`);
    const data = await res.json();
    return data.videos || [];
  }

  async function renderVideos() {
    videosGrid.innerHTML = '<div class="empty"><p>Cargando...</p></div>';

    try {
      const videos = await fetchVideos(currentCategory);

      if (videos.length === 0) {
        videosGrid.innerHTML = `
          <div class="empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <polygon points="10 8 16 12 10 16 10 8" fill="currentColor"></polygon>
            </svg>
            <h3>No hay videos</h3>
            <p>Sé el primero en publicar uno</p>
          </div>
        `;
        return;
      }

      videosGrid.innerHTML = videos.map(video => {
        const initial = (video.author?.name || '?').charAt(0).toUpperCase();
        const views = video.views || '0';
        const authorName = video.author?.name || 'Anónimo';

        return `
          <article class="video-card" data-id="${video.id}">
            <div class="thumb">
              <img src="${video.thumb}" alt="" loading="lazy">
              <span class="duration">${video.duration}</span>
            </div>
            <div class="video-info">
              <div class="channel-avatar">${escapeHtml(initial)}</div>
              <div class="video-details">
                <h3 class="video-title">${escapeHtml(video.title)}</h3>
                <div class="video-meta">
                  <div class="author">${escapeHtml(authorName)}</div>
                  <div>${views} vistas</div>
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');

      document.querySelectorAll('.video-card').forEach(card => {
        card.addEventListener('click', () => {
          localStorage.setItem('xvnn_current_video', card.dataset.id);
          localStorage.setItem('xvnn_current_category', currentCategory);
          window.location.href = `watch.html?id=${card.dataset.id}`;
        });
      });

    } catch (err) {
      console.error(err);
      videosGrid.innerHTML = '<div class="empty"><p>Error cargando videos</p></div>';
    }
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
  }

  // ============ INICIALIZACIÓN ============
  (async () => {
    await loadUserPreferences();
    updateActiveOption();
    renderVideos();
  })();
</script>

</body>
</html>
