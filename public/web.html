<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>XVNN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0f0f0f;
    --bg-2: #181818;
    --bg-3: #212121;
    --bg-hover: #272727;
    --border: #272727;
    --red: #e50914;
    --text: #f1f1f1;
    --text-2: #aaaaaa;
    --text-3: #717171;
    --header-h: 56px;
    --panel-width: 300px;
  }

  html, body {
    height: 100%;
    font-family: 'Roboto', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body.no-scroll {
    overflow: hidden;
    position: fixed;
    width: 100%;
  }

  /* ============ HEADER ============ */
  .top-header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--header-h);
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px 0 8px;
    z-index: 90;
    border-bottom: 1px solid var(--border);
  }

  .hamburger-btn {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    color: var(--text);
    cursor: pointer;
    border-radius: 50%;
    transition: background 0.15s ease;
  }

  .hamburger-btn:hover { background: var(--bg-3); }
  .hamburger-btn:active { background: var(--bg-hover); }

  .hamburger-btn svg { width: 22px; height: 22px; }

  .brand {
    font-size: 20px;
    font-weight: 500;
    letter-spacing: -0.5px;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
  }

  .brand span { color: var(--red); }

  .header-right {
    width: 44px;
    height: 44px;
  }

  /* ============ OVERLAY ============ */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    z-index: 98;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s ease, visibility 0.25s ease;
  }

  .overlay.open {
    opacity: 1;
    visibility: visible;
  }

  /* ============ PANEL LATERAL ============ */
  .side-panel {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: var(--panel-width);
    max-width: 85vw;
    background: var(--bg-2);
    z-index: 99;
    transform: translateX(-100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    -webkit-overflow-scrolling: touch;
  }

  .side-panel.open {
    transform: translateX(0);
  }

  .side-panel::-webkit-scrollbar { width: 4px; }
  .side-panel::-webkit-scrollbar-thumb {
    background: var(--bg-hover);
    border-radius: 2px;
  }

  /* ============ PERFIL EN EL PANEL ============ */
  .panel-profile {
    padding: 28px 16px 20px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .panel-avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--red);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 500;
    color: #fff;
    margin: 0 auto 12px;
    overflow: hidden;
    text-transform: uppercase;
    flex-shrink: 0;
  }

  .panel-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .panel-name {
    font-size: 16px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .panel-username {
    font-size: 13px;
    color: var(--text-3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ============ CATEGORÍAS EN EL PANEL ============ */
  .panel-section {
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .panel-section-title {
    padding: 0 20px 10px;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .category-list {
    display: flex;
    flex-direction: column;
  }

  .category-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 20px;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 400;
    cursor: pointer;
    text-align: left;
    transition: background 0.15s ease;
    position: relative;
  }

  .category-item:hover { background: var(--bg-3); }
  .category-item:active { background: var(--bg-hover); }

  .category-item.active {
    background: var(--bg-3);
    font-weight: 500;
  }

  .category-item.active::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--red);
  }

  .category-flag {
    font-size: 20px;
    line-height: 1;
    flex-shrink: 0;
  }

  .category-name {
    flex: 1;
  }

  /* ============ OPCIONES DEL PANEL ============ */
  .panel-menu {
    padding: 8px 0;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .menu-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 20px;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 400;
    cursor: pointer;
    text-align: left;
    text-decoration: none;
    transition: background 0.15s ease;
  }

  .menu-item:hover { background: var(--bg-3); }
  .menu-item:active { background: var(--bg-hover); }

  .menu-item svg {
    width: 20px;
    height: 20px;
    color: var(--text-2);
    flex-shrink: 0;
  }

  .menu-item.logout {
    color: var(--red);
    margin-top: auto;
    border-top: 1px solid var(--border);
  }

  .menu-item.logout svg { color: var(--red); }

  /* ============ GRID DE VIDEOS ============ */
  .videos-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    padding: calc(var(--header-h) + 12px) 12px 20px;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* ============ CARD DE VIDEO (VERTICAL) ============ */
  .video-card {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    border-radius: 12px;
    overflow: hidden;
    background: var(--bg-2);
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    animation: cardIn 0.4s ease backwards;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .video-card:active { transform: scale(0.97); }

  @media (hover: hover) {
    .video-card:hover {
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
  }

  /* Miniatura ocupa todo el card */
  .video-card img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Gradiente sutil para legibilidad */
  .video-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 40%, transparent 65%);
    pointer-events: none;
    z-index: 1;
  }

  /* Info dentro del card, abajo */
  .video-info-overlay {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 10px 12px 12px;
    z-index: 2;
    color: #fff;
  }

  .video-title-overlay {
    font-size: 13px;
    font-weight: 500;
    line-height: 1.3;
    margin-bottom: 6px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }

  .video-meta-overlay {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.85);
    font-weight: 500;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }

  .video-meta-overlay .dot {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.5);
  }

  .video-duration-overlay {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .video-duration-overlay::before {
    content: '';
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 6px var(--red);
  }

  /* ============ EMPTY ============ */
  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 20px;
    color: var(--text-3);
  }

  .empty svg {
    width: 48px;
    height: 48px;
    margin-bottom: 16px;
    opacity: 0.4;
  }

  .empty h3 {
    font-size: 16px;
    font-weight: 400;
    margin-bottom: 6px;
    color: var(--text-2);
  }

  .empty p {
    font-size: 13px;
  }

  /* ============ RESPONSIVE ============ */
  @media (min-width: 640px) {
    .videos-grid {
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .panel-avatar { width: 80px; height: 80px; font-size: 30px; }
  }

  @media (min-width: 900px) {
    .videos-grid {
      grid-template-columns: repeat(4, 1fr);
    }
  }

  @media (min-width: 1200px) {
    .videos-grid {
      grid-template-columns: repeat(5, 1fr);
    }
  }
</style>
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="top-header">
  <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menú">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>

  <div class="brand">XV<span>NN</span></div>

  <div class="header-right"></div>
</header>

<!-- ============ OVERLAY ============ -->
<div class="overlay" id="overlay"></div>

<!-- ============ PANEL LATERAL ============ -->
<aside class="side-panel" id="sidePanel">
  
  <!-- Perfil del usuario -->
  <div class="panel-profile">
    <div class="panel-avatar" id="panelAvatar">?</div>
    <div class="panel-name" id="panelName">Cargando...</div>
    <div class="panel-username" id="panelUsername">@usuario</div>
  </div>

  <!-- Categorías -->
  <div class="panel-section">
    <div class="panel-section-title">Categorías</div>
    <div class="category-list" id="categoryList">
      <button class="category-item" data-cat="Hetero">
        <span class="category-flag">👫</span>
        <span class="category-name">Hetero</span>
      </button>
      <button class="category-item" data-cat="Gay">
        <span class="category-flag">🏳️‍🌈</span>
        <span class="category-name">Gay</span>
      </button>
      <button class="category-item" data-cat="Bi">
        <span class="category-flag">💜</span>
        <span class="category-name">Bi</span>
      </button>
      <button class="category-item" data-cat="Trans">
        <span class="category-flag">🏳️‍⚧️</span>
        <span class="category-name">Trans</span>
      </button>
    </div>
  </div>

  <!-- Menú -->
  <div class="panel-menu">
    <a href="profile.html" class="menu-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <span>Mi Perfil</span>
    </a>

    <a href="my-videos.html" class="menu-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="16" rx="2"></rect>
        <polygon points="10 8 16 12 10 16 10 8" fill="currentColor"></polygon>
      </svg>
      <span>Mis Videos</span>
    </a>

    <button class="menu-item logout" id="logoutBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span>Cerrar sesión</span>
    </button>
  </div>

</aside>

<!-- ============ GRID DE VIDEOS ============ -->
<main class="videos-grid" id="videosGrid"></main>

<script>
  const API_URL = window.location.origin + '/api';
  const token = localStorage.getItem('xvnn_token');
  const CATEGORIES = ['Hetero', 'Gay', 'Bi', 'Trans'];

  if (!token) window.location.href = 'auth.html';

  let currentCategory = 'Hetero';

  const els = {
    hamburgerBtn: document.getElementById('hamburgerBtn'),
    overlay: document.getElementById('overlay'),
    sidePanel: document.getElementById('sidePanel'),
    panelAvatar: document.getElementById('panelAvatar'),
    panelName: document.getElementById('panelName'),
    panelUsername: document.getElementById('panelUsername'),
    categoryList: document.getElementById('categoryList'),
    categoryItems: document.querySelectorAll('.category-item'),
    logoutBtn: document.getElementById('logoutBtn'),
    videosGrid: document.getElementById('videosGrid')
  };

  // ============================================================
  //  PANEL LATERAL
  // ============================================================
  function openPanel() {
    els.sidePanel.classList.add('open');
    els.overlay.classList.add('open');
    document.body.classList.add('no-scroll');
  }

  function closePanel() {
    els.sidePanel.classList.remove('open');
    els.overlay.classList.remove('open');
    document.body.classList.remove('no-scroll');
  }

  els.hamburgerBtn.addEventListener('click', openPanel);
  els.overlay.addEventListener('click', closePanel);

  // Cerrar con Escape
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closePanel();
  });

  // ============================================================
  //  CARGAR PERFIL EN EL PANEL
  // ============================================================
  async function loadPanelProfile() {
    try {
      const res = await fetch(`${API_URL}/auth/me`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();

      if (res.ok && data.user) {
        const user = data.user;
        const initial = (user.name || user.username || '?').charAt(0).toUpperCase();
        
        // Avatar
        els.panelAvatar.textContent = initial;
        
        // Nombre y username
        els.panelName.textContent = user.name || user.username;
        els.panelUsername.textContent = '@' + user.username;
      }
    } catch (err) {
      console.warn('Error cargando perfil en el panel:', err);
      els.panelName.textContent = 'Usuario';
      els.panelUsername.textContent = '@usuario';
    }
  }

  // ============================================================
  //  CATEGORÍA PREDEFINIDA DEL USUARIO
  // ============================================================
  async function loadUserPreferences() {
    try {
      const res = await fetch(`${API_URL}/auth/preferences`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();
      if (res.ok && data.defaultCategory) {
        currentCategory = data.defaultCategory;
        localStorage.setItem('xvnn_category', currentCategory);
      }
    } catch (err) {
      console.warn('No se pudo cargar la preferencia');
      currentCategory = 'Hetero';
    }
  }

  // ============================================================
  //  SELECCIÓN DE CATEGORÍA
  // ============================================================
  els.categoryItems.forEach(item => {
    item.addEventListener('click', async () => {
      const cat = item.dataset.cat;
      if (cat === currentCategory) {
        closePanel();
        return;
      }

      currentCategory = cat;
      localStorage.setItem('xvnn_category', cat);
      updateActiveCategory();
      closePanel();
      renderVideos();

      // Guardar preferencia en el backend
      try {
        await fetch(`${API_URL}/auth/preferences/category`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ category: cat })
        });
      } catch (err) {
        console.warn('No se pudo guardar la preferencia:', err.message);
      }
    });
  });

  function updateActiveCategory() {
    els.categoryItems.forEach(item => {
      item.classList.toggle('active', item.dataset.cat === currentCategory);
    });
  }

  // ============================================================
  //  CERRAR SESIÓN
  // ============================================================
  els.logoutBtn.addEventListener('click', () => {
    if (!confirm('¿Cerrar sesión?')) return;

    localStorage.removeItem('xvnn_token');
    localStorage.removeItem('xvnn_user');
    localStorage.removeItem('xvnn_current_video');
    localStorage.removeItem('xvnn_current_category');
    window.location.href = 'auth.html';
  });

  // ============================================================
  //  CARGAR VIDEOS
  // ============================================================
  async function fetchVideos(category) {
    const res = await fetch(`${API_URL}/videos?category=${category}`);
    const data = await res.json();
    return data.videos || [];
  }

  async function renderVideos() {
    els.videosGrid.innerHTML = '<div class="empty"><p>Cargando...</p></div>';

    try {
      const videos = await fetchVideos(currentCategory);

      if (videos.length === 0) {
        els.videosGrid.innerHTML = `
          <div class="empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <polygon points="10 8 16 12 10 16 10 8" fill="currentColor"></polygon>
            </svg>
            <h3>No hay videos</h3>
            <p>Sé el primero en publicar uno en ${currentCategory}</p>
          </div>
        `;
        return;
      }

      els.videosGrid.innerHTML = videos.map((video, i) => `
        <article class="video-card" data-id="${video.id}" style="animation-delay: ${i * 0.03}s">
          <img src="${video.thumb}" alt="" loading="lazy">
          <div class="video-info-overlay">
            <h3 class="video-title-overlay">${escapeHtml(video.title)}</h3>
            <div class="video-meta-overlay">
              <span class="video-duration-overlay">${video.duration}</span>
              <span class="dot"></span>
              <span>${video.views} vistas</span>
            </div>
          </div>
        </article>
      `).join('');

      // Eventos de clic
      document.querySelectorAll('.video-card').forEach(card => {
        card.addEventListener('click', () => {
          const id = card.dataset.id;
          localStorage.setItem('xvnn_current_video', id);
          localStorage.setItem('xvnn_current_category', currentCategory);
          window.location.href = `watch.html?id=${id}`;
        });
      });

    } catch (err) {
      console.error('Error cargando videos:', err);
      els.videosGrid.innerHTML = `
        <div class="empty">
          <h3>Error cargando videos</h3>
          <p>Revisa tu conexión e intenta de nuevo</p>
        </div>
      `;
    }
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
  }

  // ============================================================
  //  INICIALIZACIÓN
  // ============================================================
  (async () => {
    // Cargar perfil y preferencias en paralelo
    await Promise.all([
      loadPanelProfile(),
      loadUserPreferences()
    ]);

    updateActiveCategory();
    renderVideos();
  })();
</script>

</body>
</html>
